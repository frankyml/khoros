# Khoros configuration
version: "4.0"
profile: "python"   # read by verify/spec generation to pick a domain profile

verify:
  gate: on            # on | off
  test_command: ""    # empty = auto-detect
  lint_commands: []
  test_timeout: 240
  max_stop_blocks: 3
  loop_edit_threshold: 8

blackboard:
  database_path: ".harness/blackboard.db"
