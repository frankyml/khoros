# Personal Development Harness (PDH) v2.0 Configuration
version: "2.0"
profile: "python"

host:
  platform: "cachyos-linux"
  cpu_cores: 4
  cpu_threads: 8
  btrfs_cow_disabled: true
  bwrap_sandbox: true

orchestrator:
  lead_persona: "@lead"
  topology: "player-coach"  # T0/T1 direct execution; T2/T3 Blackboard DAG + subagent fan-out
  verify_before_submit: true
  adversarial_critic: true

models:
  reasoning:
    id: "gemini-pro"
    description: "Gemini Pro for @lead triage, @architect RFC/PRD synthesis, STRIDE security, and @critic verification"
    temperature: 0.2
  fast:
    id: "gemini-flash"
    description: "Gemini Flash for @explorer context harvesting, AST linting, persona evaluation, and fast checks"
    temperature: 0.1

governor:
  concurrency:
    max_parallel_subagents: 2
    max_worker_threads: 4
  token_budget:
    rpm_limit: 60
    tpm_limit: 1000000
    reserved_headroom_ratio: 0.25  # 25% exclusive reserve for Q0 (Critical/Critic) and Q1 (Lead/Architect)
    cache_prefix_min_tokens: 32768
  leases:
    lease_ttl_seconds: 1800
    heartbeat_interval_seconds: 60

mobile:
  default_engine: "kmp"  # Options: "kmp", "compose", "flutter"
  android_target_sdk: 34
  frame_pacing:
    enforce_vsync: true
    max_jank_percentage: 1.0
    max_frame_time_95th_ms: 16.66  # 8.33ms for 120Hz, 16.66ms for 60Hz
  offline_sync:
    protocol: "occ_field_level"
    mutation_journal: true

blackboard:
  database_path: ".harness/blackboard.db"
  wal_mode: true
  busy_timeout_ms: 5000
